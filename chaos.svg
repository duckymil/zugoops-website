   <stop offset="0" stop-color="#09141a"/><stop offset="1" stop-color="#0d222a"/>
 </linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<title>Ręczna koordynacja i chaos</title>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/>
<circle cx="1030" cy="100" r="180" fill="#24d7b5" opacity=".035"/>


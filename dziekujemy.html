<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dziękujemy — Zugo Ops</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#071015">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <style>
    :root{--bg:#071015;--text:#f2f5f6;--muted:#a9b7bd;--mint:#24d7b5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0%,rgba(36,215,181,.13),transparent 38%),var(--bg)}
    .box{width:min(100%,690px);padding:54px;border:1px solid rgba(36,215,181,.22);border-radius:30px;background:rgba(255,255,255,.04);text-align:center}
    .mark{width:54px;height:54px;border-radius:18px;margin:0 auto 24px;display:grid;place-items:center;background:rgba(36,215,181,.10);color:var(--mint);font-size:25px;font-weight:900}
    h1{font-size:clamp(36px,6vw,54px);line-height:1.02;letter-spacing:-.045em;margin:0}
    p{color:var(--muted);font-size:17px;line-height:1.6;max-width:560px;margin:18px auto 28px}
    .btn{display:inline-flex;min-height:50px;padding:0 20px;align-items:center;justify-content:center;border-radius:15px;background:linear-gradient(135deg,var(--mint),#78e8c8);color:#062118;text-decoration:none;font-weight:800}
    @media(max-width:600px){.box{padding:36px 22px}}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">✓</div>
    <h1>Dziękujemy za kontakt.</h1>
    <p>Twoje zgłoszenie zostało przesłane. Wkrótce się odezwiemy.</p>
    <a class="btn" href="https://zugoops.pl/">Wróć na stronę</a>
  </main>
</body>
</html>
